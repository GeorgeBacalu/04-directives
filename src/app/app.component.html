<div class="container">
  <div class="row">
    <div class="col-xs-12">
      <button class="btn btn-primary" (click)="onlyOdd = !onlyOdd">Only show odd numbers</button>
      <br />
      <ul class="list-group">
        <!-- <div *ngIf="onlyOdd">
          <li class="list-group-item" *ngFor="let odd of oddNumbers" [ngClass]="{ odd: odd % 2 !== 0 }" [ngStyle]="{ backgroundColor: odd % 2 !== 0 ? 'green' : 'transparent' }">{{ odd }}</li>
        </div>
        <div *ngIf="!onlyOdd">
          <li class="list-group-item" *ngFor="let even of evenNumbers" [ngClass]="{ even: even % 2 === 0 }" [ngStyle]="{ backgroundColor: even % 2 === 0 ? 'yellow' : 'transparent' }">{{ even }}</li>
        </div> -->
        <!-- <ng-template [ngIf]="onlyOdd">
          <div>
            <li class="list-group-item" *ngFor="let odd of oddNumbers" [ngClass]="{ odd: odd % 2 !== 0 }" [ngStyle]="{ backgroundColor: odd % 2 !== 0 ? 'green' : 'transparent' }">{{ odd }}</li>
          </div>
        </ng-template>
        <ng-template [ngIf]="!onlyOdd">
          <div>
            <li class="list-group-item" *ngFor="let even of evenNumbers" [ngClass]="{ even: even % 2 === 0 }" [ngStyle]="{ backgroundColor: even % 2 === 0 ? 'yellow' : 'transparent' }">{{ even }}</li>
          </div>
        </ng-template> -->
        <div *ngIf="onlyOdd">
          <li class="list-group-item" *ngFor="let odd of oddNumbers" [ngClass]="{ odd: odd % 2 !== 0 }" [ngStyle]="{ backgroundColor: odd % 2 !== 0 ? 'green' : 'transparent' }">{{ odd }}</li>
        </div>
        <div *appUnless="onlyOdd">
          <li class="list-group-item" *ngFor="let even of evenNumbers" [ngClass]="{ even: even % 2 === 0 }" [ngStyle]="{ backgroundColor: even % 2 === 0 ? 'yellow' : 'transparent' }">{{ even }}</li>
        </div>
      </ul>
      <p appHighlight>Style me with basic directive!</p>
      <p appNewHighlight defaultColor="cyan" highlightColor="teal">Style me with new directive!</p>
      <div [ngSwitch]="value">
        <p *ngSwitchCase="1">Value is 1</p>
        <p *ngSwitchCase="2">Value is 2</p>
        <p *ngSwitchCase="3">Value is 3</p>
        <p *ngSwitchDefault>Value is default</p>
      </div>
    </div>
  </div>
</div>
